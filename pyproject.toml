[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "guava-rt"
dynamic = ["version"]
description = "A geometrical upright-supine anatomical variation analysis framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Chung Tin Lo", email = "lochungtin@gmail.com" },
    { name = "Jamie McClelland" },
    { name = "Tracy Underwood" },
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = [
    "upright", "supine", "anatomy", "medical images", "geometrical", "analysis", "metrics"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/lochungtin/GUAVA"
Repository = "https://github.com/lochungtin/GUAVA.git"
"Bug Tracker" = "https://github.com/lochungtin/GUAVA/issues"
Changelog = "https://github.com/lochungtin/GUAVA/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "scipy>=1.10",
]

[tool.hatch.version]
source = "vcs"
# Untagged commits build as X.Y.Z.postN.devM (unique on TestPyPI).
raw-options = { version_scheme = "no-guess-dev", local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/guava_rt"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.5.1"
tag_format = "v$version"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "gpu: requires a CUDA device",
    "slow: takes minutes; runs only with GUAVA_SLOW=1",
]
